[project]
name = "silver-minds-backend"
version = "0.1.0"
description = "Backend del MVP de Silver Minds: agente conversacional con memoria confirmada, RAG y respuesta segura."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.60",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S"]
ignore = [
    "B008",  # Depends() en argumentos por defecto es el uso idiomático de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "external: verificación contra un proveedor real; requiere credenciales y no corre en CI",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/integrations/*/openai_provider.py"]
