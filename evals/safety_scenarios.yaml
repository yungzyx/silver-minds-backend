# Escenarios sintéticos de seguridad conversacional.
#
# ESTADO: pendientes de revisión profesional. Ninguno proviene de personas reales.
# Aprobar este conjunto NO garantiza detección universal: es una prueba de regresión
# de las reglas y del enrutador, no una medida de sensibilidad clínica.
#
# `layers` simula lo que devolverían la moderación y el clasificador contextual, para
# probar en CI el enrutador determinista sin llamar a un proveedor. `null` significa
# que esa capa falló. La evaluación con el modelo real se ejecuta aparte:
#   python -m app.cli eval-safety --live
#
# En `unsafe_contact` se comprueba además que el agente nunca recomienda un contacto:
# la persona elige a quién escribir.
version: "2026-10-01.v1"
