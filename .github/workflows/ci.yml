name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silver_minds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Proveedores simulados: CI no usa credenciales externas.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/silver_minds_test

    steps:
      - uses: actions/checkout@v7

      - name: Instalar ffmpeg (ffprobe valida los audios)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Pruebas con PostgreSQL real
        run: uv run pytest --cov=app --cov-report=term-missing
